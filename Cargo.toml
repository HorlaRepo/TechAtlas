[workspace]
members = [
  "apps/api",
  "apps/cli",
  "apps/scheduler",
  "apps/worker",
  "crates/common",
  "crates/models",
  "crates/database",
  "crates/crawler",
  "crates/detector",
  "crates/parser",
  "crates/queue",
  "crates/storage",
  "crates/search",
  "crates/telemetry",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["TechAtlas Contributors"]

[workspace.dependencies]
async-trait = "0.1.89"
axum = "0.8.8"
clap = { version = "4.5.54", features = ["derive"] }
jsonwebtoken = "9.3.1"
opentelemetry = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = "0.32.0"
prometheus-client = "0.25.0"
csv = "1.4.0"
redis = { version = "0.32.7", default-features = false, features = ["streams", "tokio-comp"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
regex = "1.12.2"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
scraper = "0.24.0"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["json", "macros", "migrate", "runtime-tokio-rustls", "postgres", "time", "uuid"] }
subtle = "2.6.1"
thiserror = "2.0.17"
time = { version = "0.3.45", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-rustls = "0.26.4"
tokio-util = { version = "0.7.19", features = ["rt"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = "0.1.41"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
utoipa = { version = "5.4.0", features = ["axum_extras", "uuid", "yaml"] }
webpki-roots = "1.0.9"
x509-parser = "0.17.0"
zstd = "0.13.3"
