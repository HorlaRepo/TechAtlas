components:
  schemas:
    ActiveRuleVersionRequest:
      type: object
      properties:
        version:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
    AdminCrawlRetryState:
      type: string
      enum:
      - in_progress
      - automatic_retry_scheduled
      - manual_retry_available
      - manual_retry_blocked
      - not_applicable
    AuditEventPageResponse:
      type: object
      required:
      - events
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AuditEventResponse'
        next_cursor:
          type:
          - string
          - 'null'
    AuditEventResponse:
      type: object
      required:
      - id
      - actor_subject
      - action
      - resource_kind
      - resource_id
      - occurred_at
      properties:
        action:
          type: string
        actor_subject:
          type: string
        id:
          type: string
        occurred_at:
          type: string
        resource_id:
          type: string
        resource_kind:
          type: string
    CountryEnrichmentRecrawlResponse:
      type: object
      required:
      - scheduled_domain_count
      properties:
        scheduled_domain_count:
          type: integer
          format: int64
          minimum: 0
    CrawlAttemptPageResponse:
      type: object
      required:
      - attempts
      properties:
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/CrawlAttemptResponse'
    CrawlAttemptResponse:
      type: object
      required:
      - job_id
      - canonical_domain
      - attempt_number
      - status
      - queued_at
      - retry_state
      - retry_eligible
      properties:
        attempt_number:
          type: integer
          format: int32
          minimum: 0
        canonical_domain:
          type: string
        failure_code:
          type:
          - string
          - 'null'
        failure_summary:
          type:
          - string
          - 'null'
        finished_at:
          type:
          - string
          - 'null'
        job_id:
          type: string
        queued_at:
          type: string
        retry_eligible:
          type: boolean
        retry_state:
          $ref: '#/components/schemas/AdminCrawlRetryState'
        status:
          type: string
    CrawlRequestResponse:
      type: object
      required:
      - canonical_domain
      - scheduled_at
      properties:
        canonical_domain:
          type: string
        scheduled_at:
          type: string
    CreateDomainRequest:
      type: object
      required:
      - domain
      properties:
        domain:
          type: string
    CsvImportRequest:
      type: object
      required:
      - source_name
      - csv
      properties:
        csv:
          type: string
        source_name:
          type: string
    CsvImportResponse:
      type: object
      required:
      - import_id
      - source_name
      - accepted_row_count
      - duplicate_row_count
      - rejected_row_count
      properties:
        accepted_row_count:
          type: integer
          format: int32
          minimum: 0
        duplicate_row_count:
          type: integer
          format: int32
          minimum: 0
        import_id:
          type: string
        rejected_row_count:
          type: integer
          format: int32
          minimum: 0
        source_name:
          type: string
    DependencyStatusResponse:
      type: object
      required:
      - name
      - status
      properties:
        name:
          type: string
        status:
          type: string
    DetectionRuleListResponse:
      type: object
      required:
      - rules
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/DetectionRuleResponse'
    DetectionRuleResponse:
      type: object
      required:
      - rule_slug
      - technology_slug
      - technology_name
      - versions
      properties:
        active_version:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        draft_definition:
          type:
          - string
          - 'null'
        draft_updated_at:
          type:
          - string
          - 'null'
        rule_slug:
          type: string
        technology_name:
          type: string
        technology_slug:
          type: string
        versions:
          type: array
          items:
            $ref: '#/components/schemas/DetectionRuleVersionResponse'
    DetectionRuleVersionResponse:
      type: object
      required:
      - version
      - definition
      - published_at
      - is_active
      properties:
        definition:
          type: string
        is_active:
          type: boolean
        published_at:
          type: string
        version:
          type: integer
          format: int32
          minimum: 0
    DomainListResponse:
      type: object
      required:
      - domains
      properties:
        domains:
          type: array
          items:
            $ref: '#/components/schemas/DomainResponse'
        next_cursor:
          type:
          - string
          - 'null'
    DomainResponse:
